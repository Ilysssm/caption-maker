<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaf82"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#87d2ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Squircle Base (Apple 22.5% continuous radius) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Inner Frosted Glass Card -->
  <rect x="64" y="64" width="384" height="384" rx="84" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <rect x="64" y="64" width="384" height="384" rx="84" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Captions Logo Bars -->
  <g transform="translate(136, 176)">
    <!-- Bar 1 -->
    <rect x="40" y="0" width="160" height="32" rx="16" fill="#111113"/>
    <!-- Bar 2 -->
    <rect x="0" y="64" width="240" height="32" rx="16" fill="#111113"/>
    <!-- Bar 3 -->
    <rect x="40" y="128" width="160" height="32" rx="16" fill="#111113"/>
  </g>

  <!-- Sparkle Accent -->
  <circle cx="372" cy="140" r="12" fill="#0071e3"/>
</svg>
